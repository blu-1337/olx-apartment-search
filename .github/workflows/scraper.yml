name: OLX Apartment Scraper

on:
  # Run every 10 minutes
  # schedule:
  #   - cron: '*/10 * * * *'
  # Allow manual triggering
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create config.json from secrets
        run: |
          python3 << 'EOF'
          import json
          import os
          
          config = {
              "telegram_bot_token": os.environ["TELEGRAM_BOT_TOKEN"],
              "telegram_chat_id": os.environ["TELEGRAM_CHAT_ID"]
          }
          
          with open("config.json", "w", encoding="utf-8") as f:
              json.dump(config, f, indent=2, ensure_ascii=False)
          EOF
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      
      - name: Run scraper
        run: python3 scraper.py
      
      - name: Commit and push updated database
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Add database file (create if it doesn't exist)
          if [ -f listings_db.json ]; then
            git add listings_db.json
            git diff --staged --quiet || git commit -m "Update listings database [skip ci]"
            git push
          fi

